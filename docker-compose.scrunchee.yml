# Run the Scrunchee fork of Scrob from its published image (see SCRUNCHEE.md).
#
# Same as docker-compose.yaml, except the image comes from SCROB_IMAGE, the data lives in
# folders you choose on the host, and the secrets are read from the environment (a .env
# file next to this one, or a Portainer stack's environment variables) instead of being
# written in here:
#
#   SCROB_IMAGE=ghcr.io/<owner>/scrob:scrunchee   # or a name to build, with --build
#   SCROB_DB_DATA_PATH=<a host folder for the database>
#   SCROB_APP_DATA_PATH=<a host folder for Scrob's data>
#   POSTGRES_PASSWORD=<a password>
#   SECRET_KEY=<openssl rand -hex 32>
#   SCROB_PORT=7330        # optional; the port to publish on this host (default 7330)
#   TZ=UTC                 # optional
#   APP_VERSION=dev        # optional; shown on the About page when the image is built
#   SCROB_CONTAINER_NAME=scrob            # optional; the container names (these are the defaults)
#   SCROB_DB_CONTAINER_NAME=scrob-db
#   DATABASE_URL=...       # optional; only to use a different database
#
# The containers have fixed names so you can find them (scrob and scrob-db unless you set the
# variables above, for example scrob-dev and scrob-dev-db for a test copy). To run a second copy next to the first, give it its own names,
# folders and SCROB_PORT.
services:
  scrob-db:
    container_name: ${SCROB_DB_CONTAINER_NAME:-scrob-db}
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: scrob
    volumes:
      - ${SCROB_DB_DATA_PATH:?set SCROB_DB_DATA_PATH to a folder on the host for the database}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrob -d scrob"]
      interval: 5s
      timeout: 5s
      retries: 10

  scrob:
    container_name: ${SCROB_CONTAINER_NAME:-scrob}
    # The image built from this fork, for example ghcr.io/<owner>/scrob:scrunchee
    image: ${SCROB_IMAGE:?set SCROB_IMAGE to the fork's image}
    # To build it from this checkout instead (a test copy), run with --build; Portainer's
    # "Repository" stack type does this from the repository. APP_VERSION shows on the About page.
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      scrob-db:
        condition: service_healthy
    ports:
      - "${SCROB_PORT:-7330}:7330"
    environment:
      # ── Database ────────────────────────────────────────────────────────────
      # Built from POSTGRES_PASSWORD; set DATABASE_URL to use a different database instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://scrob:${POSTGRES_PASSWORD}@scrob-db:5432/scrob}

      # ── Security ────────────────────────────────────────────────────────────
      # Generate with: openssl rand -hex 32
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}

      # ── Registrations ────────────────────────────────────────────────────────
      # Registrations are disabled by default. Set to true to allow additional users.
      # ENABLE_REGISTRATIONS: "true"
      # REGISTRATION_MAX_ALLOWED_USERS: "0"  # 0 = unlimited

      # Days a login lasts when "Stay logged in" is ticked (7 days otherwise)
      # SESSION_REMEMBER_DAYS: "30"

      # ── Nuvio (optional) ───────────────────────────────────────────────────
      # Set this to the anon/public key when using a self-hosted Nuvio backend.
      # NUVIO_APP_ANON_KEY: ""

      # ── ARVIO (optional) ────────────────────────────────────────────────────
      # Overrides the embedded public anon key for auth.arvio.tv. Leave unset
      # to use the official key.
      # ARVIO_APP_ANON_KEY: ""

      # ── OIDC (optional) ─────────────────────────────────────────────────────
      # OIDC_ENABLED: "false"
      # OIDC_PROVIDER_NAME: SSO
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_AUTH_URL: ""
      # OIDC_TOKEN_URL: ""
      # OIDC_USERINFO_URL: ""
      # OIDC_REDIRECT_URL: http://your-server:7330/oidc-callback
      # OIDC_DISCOVERY_URL: https://your-idp.example.com/.well-known/openid-configuration   # recommended — enables id_token verification + (issuer, sub) binding
      # OIDC_ISSUER: ""        # explicit fallback when discovery isn't available
      # OIDC_JWKS_URL: ""      # explicit fallback when discovery isn't available
      # OIDC_LOGOUT_URL: ""    # end_session endpoint; populated from discovery when unset
      # OIDC_POST_LOGOUT_REDIRECT_URL: ""   # defaults to SERVER_URL + /login
      # OIDC_SCOPES: "openid email profile"
      # OIDC_IDENTIFIER_FIELD: email         # only used in compat (no-discovery) mode
      # OIDC_AUTO_CREATE_USERS: "true"
      # OIDC_DISABLE_PASSWORD_LOGIN: "false"
      # OIDC_PKCE: "true"      # escape hatch; leave on unless the IdP breaks on PKCE

      # ── User & timezone ──────────────────────────────────────────────────────
      # Run the process as a specific user/group (defaults to 1000:1000)
      # PUID: "1000"
      # PGID: "1000"
      TZ: ${TZ:-UTC}

      # ── Advanced ─────────────────────────────────────────────────────────────
      # Override the internal backend port (only needed if 7331 conflicts on bare metal installations)
      # BACKEND_PORT: "7331"
    volumes:
      - ${SCROB_APP_DATA_PATH:?set SCROB_APP_DATA_PATH to a folder on the host for Scrob's data}:/app/backend/data

